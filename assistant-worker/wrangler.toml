name = "universo-esoterico-chat"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Solo la URL principal; sin URLs de vista previa
workers_dev = true
preview_urls = false

[vars]
# Dominios que pueden usar el asistente (separados por coma)
ALLOWED_ORIGINS = "https://esoterica-app.web.app,https://esoterica-app.firebaseapp.com,http://localhost:5173"
GROQ_MODEL = "openai/gpt-oss-120b"
GROQ_FALLBACK_MODEL = "openai/gpt-oss-20b"
